<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="description" content="گپ‌خونه؛ گفت‌وگوی دوستانه و گروهی"><link rel="manifest" href="/static/manifest.json"><title>گپ‌خونه</title><style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--bg:#0b1220;--panel:#111c2e;--panel2:#17243a;--line:#26364d;--txt:#edf3fc;--muted:#8fa1b9;--accent:#7c5cff;--accent2:#19c7a3;--bubble:#1c2a40;--shadow:0 24px 70px #0005}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#20234a 0,transparent 35%),var(--bg);color:var(--txt);font-family:Vazirmatn,system-ui,sans-serif;height:100dvh;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.auth-wrap{height:100dvh;display:grid;place-items:center;padding:18px}.auth{width:min(440px,100%);background:#111c2eeb;border:1px solid var(--line);border-radius:26px;padding:30px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:25px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#18c7a3);display:grid;place-items:center;font-size:24px;box-shadow:0 8px 25px #7c5cff55}.sub{color:var(--muted);font-size:13px;margin:7px 0 22px}.tabs{display:flex;background:#0b1423;padding:4px;border-radius:13px;margin:18px 0}.tabs button{flex:1;background:transparent;color:var(--muted);padding:10px;border-radius:10px}.tabs button.active{background:var(--panel2);color:white}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#0b1423;color:var(--txt);padding:13px 14px;border-radius:12px;outline:none}.field input:focus,.field textarea:focus{border-color:var(--accent)}.captcha-row{display:flex;align-items:center;gap:9px}.captcha-row img{height:48px;width:145px;object-fit:contain;background:#f4f7fc;border-radius:9px}.captcha-row input{min-width:0;flex:1}.primary{width:100%;background:linear-gradient(110deg,var(--accent),#5a8cff);color:white;border-radius:12px;padding:13px;font-weight:700;margin-top:8px}.note{font-size:11px;color:var(--muted);line-height:1.9;margin-top:13px}.app{height:100dvh;display:grid;grid-template-columns:350px 1fr;max-width:1500px;margin:auto;background:#0c1524;border-inline:1px solid #26364d}.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:#101a2b}.side-head{padding:18px 18px 12px;display:flex;align-items:center;justify-content:space-between}.side-head .brand{font-size:20px}.side-head .logo{width:39px;height:39px;font-size:19px;border-radius:13px}.icon-btn{width:39px;height:39px;border-radius:12px;background:var(--panel2);color:#dce7f8;font-size:18px}.search{padding:0 15px 12px}.search input{width:100%;background:#0a1423;border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:white;outline:0}.section-label{padding:7px 17px;color:var(--muted);font-size:11px}.chat-list{overflow:auto;flex:1}.chat-item{display:flex;align-items:center;gap:11px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #ffffff08}.chat-item:hover,.chat-item.active{background:#1a2940}.avatar{width:46px;height:46px;flex:none;border-radius:16px;background:linear-gradient(135deg,#6654d9,#19bfa0);display:grid;place-items:center;font-weight:800;color:white;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.chat-meta{min-width:0;flex:1}.chat-top{display:flex;justify-content:space-between;gap:6px}.chat-name{font-weight:600;font-size:14px}.chat-time{font-size:10px;color:var(--muted)}.chat-last{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.mebar{padding:12px 15px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}.mebar .chat-meta{flex:1}.mebar button{color:var(--muted);background:none}.main{display:flex;flex-direction:column;min-width:0;position:relative;background:radial-gradient(circle at 80% 80%,#172644 0,transparent 42%),#0d1727}.welcome{margin:auto;text-align:center;padding:25px;color:var(--muted)}.welcome .logo{margin:auto;width:75px;height:75px;font-size:34px;border-radius:24px}.welcome h2{color:white}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:12px;background:#111c2bd9}.topbar .chat-meta{flex:1}.topbar .chat-name{font-size:15px}.topbar .chat-last{font-size:11px}.messages{flex:1;overflow:auto;padding:22px clamp(12px,4vw,54px);display:flex;flex-direction:column;gap:11px}.msg{max-width:min(72%,560px);background:var(--bubble);border:1px solid #ffffff0a;border-radius:17px 17px 5px 17px;padding:9px 13px;align-self:flex-start;box-shadow:0 4px 14px #0002}.msg.mine{align-self:flex-end;background:linear-gradient(135deg,#5748bd,#4358a7);border-radius:17px 17px 17px 5px}.msg .sender{font-size:11px;color:#a9e8dc;margin-bottom:3px}.msg .body{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.msg .time{font-size:9px;color:#c2cbe0;text-align:left;margin-top:4px}.composer{padding:13px 20px max(13px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:end;border-top:1px solid var(--line);background:#101b2b}.composer textarea{flex:1;resize:none;max-height:130px;min-height:46px;background:#0a1423;color:white;border:1px solid var(--line);border-radius:15px;padding:12px 14px;outline:0}.send{width:47px;height:47px;border-radius:15px;background:var(--accent);color:white;font-size:20px}.empty{margin:auto;color:var(--muted);text-align:center}.modal-back{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:15px;z-index:10}.modal{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.modal h3{margin:0 0 16px}.modal-actions{display:flex;gap:8px;margin-top:15px}.modal-actions button{flex:1;padding:11px;border-radius:11px;background:var(--panel2);color:white}.modal-actions .primary2{background:var(--accent)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#26364d;color:white;padding:10px 16px;border-radius:12px;z-index:30;font-size:13px;box-shadow:var(--shadow)}.mobile-back{display:none;background:none;color:white;font-size:22px}.online-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent2);margin-left:5px}
@media(max-width:760px){.app{display:block;border:0}.side{height:100dvh;width:100%;border:0}.main{display:none;height:100dvh}.app.chat-open .side{display:none}.app.chat-open .main{display:flex}.mobile-back{display:block}.topbar{height:68px;padding:0 12px}.messages{padding:15px 12px}.composer{padding:10px 10px max(10px,env(safe-area-inset-bottom))}.msg{max-width:86%}.auth{padding:23px}.chat-item{padding:11px 14px}}
</style></head><body>
<div id="auth" class="auth-wrap"><div class="auth"><div class="brand"><div class="logo">گ</div>گپ‌خونه</div><div class="sub">یه جای خودمونی برای حرف‌های شما و دوستات</div><div class="tabs"><button id="loginTab" class="active" onclick="setAuth('login')">ورود</button><button id="registerTab" onclick="setAuth('register')">ثبت‌نام</button></div><form id="authForm"><div id="displayField" class="field hidden"><label>نام نمایشی</label><input id="displayName" maxlength="60" placeholder="مثلاً محمد"></div><div class="field"><label>نام کاربری انگلیسی</label><input id="username" required minlength="3" maxlength="32" autocomplete="username" placeholder="مثلاً ali_20"></div><div class="field"><label>رمز عبور (حداقل ۸ کاراکتر)</label><input id="password" type="password" required minlength="8" maxlength="72" autocomplete="current-password" placeholder="رمز عبور"></div><div class="field"><label>کد امنیتی تصویر را وارد کن</label><div class="captcha-row"><img id="captchaImg" alt="کد امنیتی"><button type="button" class="icon-btn" onclick="loadCaptcha()">↻</button><input id="captchaAnswer" required maxlength="8" placeholder="کد تصویر"></div></div><button class="primary" id="authSubmit">ورود به گپ‌خونه</button></form><div class="note">با ساخت حساب، مسئولیت حفظ رمز عبور خود را بر عهده دارید. از رمز عبور تکراری یا حساس استفاده نکنید.</div></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="side-head"><div class="brand"><div class="logo">گ</div>گپ‌خونه</div><button class="icon-btn" onclick="openNew()" title="گفت‌وگوی جدید">＋</button></div><div class="search"><input id="searchChats" placeholder="جست‌وجوی گفتگوها…" oninput="renderChats()"></div><div class="section-label">گفتگوهای من</div><div id="chatList" class="chat-list"></div><div class="mebar"><div id="myAvatar" class="avatar">م</div><div class="chat-meta"><div id="myName" class="chat-name">کاربر</div><div id="myHandle" class="chat-last">@username</div></div><button onclick="openProfile()">⚙ پروفایل</button></div></aside><main class="main"><div id="welcome" class="welcome"><div class="logo">گ</div><h2>به گپ‌خونه خوش اومدی</h2><p>یک گفتگو انتخاب کن یا با دوستانت گفت‌وگوی تازه بساز.</p></div><div id="chatView" class="hidden" style="display:flex;flex-direction:column;min-height:0;flex:1"><header class="topbar"><button class="mobile-back" onclick="backToList()">→</button><div id="peerAvatar" class="avatar">گ</div><div class="chat-meta"><div id="activeTitle" class="chat-name">گفتگو</div><div id="activeSub" class="chat-last">گپ‌خونه</div></div><button class="icon-btn" onclick="refreshMessages()">↻</button></header><div id="messages" class="messages"></div><form class="composer" id="sendForm"><textarea id="messageInput" rows="1" placeholder="پیامت رو بنویس…" maxlength="4000"></textarea><button class="send" aria-label="ارسال">➤</button></form></div></main></div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
let authMode='login',captchaId='',token=localStorage.getItem('gk_token')||'',me=null,chats=[],active=null,socket=null,seen=new Set();
const $=id=>document.getElementById(id);const headers=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token});
async function api(url,opts={}){let r=await fetch(url,{...opts,headers:{...(opts.headers||{}),'Authorization':'Bearer '+token,...(opts.body instanceof FormData?{}:{'Content-Type':'application/json'})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'خطا در ارتباط با سرور');return d}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function setAuth(m){authMode=m;$('loginTab').classList.toggle('active',m==='login');$('registerTab').classList.toggle('active',m==='register');$('displayField').classList.toggle('hidden',m!=='register');$('authSubmit').textContent=m==='login'?'ورود به گپ‌خونه':'ساخت حساب کاربری';$('password').autocomplete=m==='login'?'current-password':'new-password';loadCaptcha()}
async function loadCaptcha(){try{let d=await fetch('/api/captcha').then(r=>r.json());captchaId=d.captcha_id;$('captchaImg').src=d.image;$('captchaAnswer').value=''}catch(e){toast('دریافت کد امنیتی ناموفق بود')}}
$('authForm').onsubmit=async e=>{e.preventDefault();let data={username:$('username').value.trim(),password:$('password').value,captcha_id:captchaId,captcha_answer:$('captchaAnswer').value,display_name:$('displayName').value};try{let d=await api('/api/'+(authMode==='login'?'login':'register'),{method:'POST',body:JSON.stringify(data)});token=d.token;localStorage.setItem('gk_token',token);me=d.user;await enterApp()}catch(err){toast(err.message);loadCaptcha()}};
async function enterApp(){ $('auth').classList.add('hidden');$('app').classList.remove('hidden');try{me=await api('/api/me');$('myName').textContent=me.display_name;$('myHandle').textContent='@'+me.username;setAvatar($('myAvatar'),me.avatar,me.display_name);await loadChats()}catch(e){logout()}}
function logout(){token='';localStorage.removeItem('gk_token');if(socket)socket.close();$('app').classList.add('hidden');$('auth').classList.remove('hidden');setAuth('login')}
function setAvatar(el,url,name){el.innerHTML=url?`<img src="${url}" alt="">`:(name||'گ').slice(0,1)}
async function loadChats(){chats=await api('/api/conversations');renderChats()}
function renderChats(){let q=$('searchChats').value.toLowerCase();let list=chats.filter(c=>(c.title+c.username+c.last_message).toLowerCase().includes(q));$('chatList').innerHTML=list.map(c=>`<div class="chat-item ${active?.id===c.id?'active':''}" onclick="openChat(${c.id})"><div class="avatar">${c.avatar?`<img src="${c.avatar}">`:esc((c.title||'گ').slice(0,1))}</div><div class="chat-meta"><div class="chat-top"><span class="chat-name">${esc(c.title)}</span><span class="chat-time">${fmt(c.last_at)}</span></div><div class="chat-last">${esc(c.last_message)}</div></div></div>`).join('')||'<div class="empty" style="padding:35px 12px">هنوز گفتگویی نداری.<br>از دکمه + شروع کن.</div>'}
async function openChat(id){active=chats.find(c=>c.id===id);if(!active)return;document.querySelector('.app').classList.add('chat-open');$('welcome').classList.add('hidden');$('chatView').classList.remove('hidden');$('activeTitle').textContent=active.title;$('activeSub').textContent=active.kind==='group'?`گروه · ${active.members} عضو`:'گفتگوی خصوصی';setAvatar($('peerAvatar'),active.avatar,active.title);await refreshMessages();connectSocket(id);renderChats()}
function backToList(){document.querySelector('.app').classList.remove('chat-open')}
function fmt(s){try{return new Date(s).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}catch{return ''}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addMessage(m){if(seen.has(m.id))return;seen.add(m.id);let div=document.createElement('div');div.className='msg '+(m.sender_id===me.id?'mine':'');div.innerHTML=(m.sender_id===me.id?'':`<div class="sender">${esc(m.sender)}</div>`)+`<div class="body">${esc(m.body)}</div><div class="time">${fmt(m.created_at)}</div>`;$('messages').appendChild(div);$('messages').scrollTop=$('messages').scrollHeight}
async function refreshMessages(){if(!active)return;let rows=await api(`/api/conversations/${active.id}/messages`);$('messages').innerHTML='';seen.clear();rows.forEach(addMessage)}
function connectSocket(id){if(socket)socket.close();socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/${id}?token=${encodeURIComponent(token)}`);socket.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='message'&&active?.id===id){addMessage(d.message);loadChats()}};socket.onclose=()=>{} }
$('sendForm').onsubmit=async e=>{e.preventDefault();let body=$('messageInput').value.trim();if(!body||!active)return;let b=$('messageInput');b.value='';try{let m=await api(`/api/conversations/${active.id}/messages`,{method:'POST',body:JSON.stringify({body})});addMessage(m);await loadChats()}catch(err){b.value=body;toast(err.message)}};
$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('sendForm').requestSubmit()}});
function openModal(html){$('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){$('modalRoot').innerHTML=''}
function openNew(){openModal(`<h3>شروع گفتگوی تازه</h3><button class="primary" onclick="newGroupForm()">＋ ساخت گروه جدید</button><div class="field"><label>شروع گفتگوی خصوصی با نام کاربری</label><input id="directName" placeholder="username"></div><div class="modal-actions"><button class="primary2" onclick="startDirect()">شروع گفتگو</button><button onclick="closeModal()">انصراف</button></div>`)}
function newGroupForm(){openModal(`<h3>ساخت گروه</h3><div class="field"><label>نام گروه</label><input id="groupTitle" maxlength="80" placeholder="مثلاً رفقای دانشگاه"></div><div class="field"><label>نام کاربری اعضا (با ویرگول جدا کن)</label><input id="groupUsers" placeholder="ali, sara, reza"></div><div class="note">اعضا باید قبلاً در گپ‌خونه ثبت‌نام کرده باشند.</div><div class="modal-actions"><button class="primary2" onclick="createGroup()">ساخت گروه</button><button onclick="closeModal()">انصراف</button></div>`)}
async function createGroup(){try{let title=$('groupTitle').value.trim(),usernames=$('groupUsers').value.split(',').map(x=>x.trim()).filter(Boolean);let d=await api('/api/groups',{method:'POST',body:JSON.stringify({title,usernames})});closeModal();await loadChats();openChat(d.id);toast('گروه ساخته شد')}catch(e){toast(e.message)}}
async function startDirect(){try{let d=await api('/api/direct',{method:'POST',body:JSON.stringify({username:$('directName').value.trim()})});closeModal();await loadChats();openChat(d.id)}catch(e){toast(e.message)}}
function openProfile(){openModal(`<h3>پروفایل من</h3><div class="field"><label>نام نمایشی</label><input id="profileName" maxlength="60" value="${esc(me.display_name)}"></div><div class="field"><label>درباره من</label><textarea id="profileBio" maxlength="180" rows="3" style="width:100%;background:#0b1423;color:white;border:1px solid var(--line);border-radius:12px;padding:12px">${esc(me.bio||'')}</textarea></div><div class="field"><label>عکس پروفایل</label><input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="modal-actions"><button class="primary2" onclick="saveProfile()">ذخیره تغییرات</button><button onclick="closeModal()">بستن</button></div><button class="primary" style="background:#9b3e54" onclick="closeModal();logout()">خروج از حساب</button>`)}
async function saveProfile(){try{let d=await api('/api/me',{method:'PUT',body:JSON.stringify({display_name:$('profileName').value,bio:$('profileBio').value})});me=d;let f=$('avatarFile').files[0];if(f){let fd=new FormData();fd.append('file',f);let r=await fetch('/api/avatar',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});let a=await r.json();if(!r.ok)throw Error(a.detail);me.avatar=a.avatar} $('myName').textContent=me.display_name;setAvatar($('myAvatar'),me.avatar,me.display_name);closeModal();toast('پروفایل ذخیره شد')}catch(e){toast(e.message)}}
(async()=>{if('serviceWorker'in navigator)navigator.serviceWorker.register('/static/sw.js').catch(()=>{});if(token){try{await enterApp()}catch{logout()}}else{loadCaptcha()}})();
</script></body></html>
